<!doctype html>
<html lang="en">
  <head>

    <title>Cafe</title>
    <link rel="stylesheet" href="desain.css" />

    <div class="kotak-respon">CAFE INDONESIA</div>
  </head>

  <body>
    <div class="container">
      <nav class="navbar">
        <div class="brand">KOPI XONE</div>
        <ul class="nav-links">

        </ul>

      <div class="card">
        <h2>Pilihan Menu KOPI XONE</h2>
        <table class="table-custom">

          </thead>
          <tbody>
            <tr>
              <td class="text-center">1</td>
              <td class="text-center">
                <img src="americano.webp" alt="americano" class="img-cover" />
              </td>
              <td><strong>Americano Ice/hot</strong></td>
              <td>Rp 25.000</td>
              <td class="text-center">
                <button class="btn-primary">Beli</button>

            </tr>
            <tr>
              <td class="text-center">2</td>
              <td class="text-center">
                <img src="hazelnut.webp" alt="hazelnut" class="img-cover" />
              </td>
              <td><strong>Hazelnut Ice Coffe</strong></td>
              <td>Rp 15.000</td>

                <button class="btn-primary">Beli</button>

            <tr>
              <td class="text-center">3</td>
              <td class="text-center">
                <img src="latte.webp" alt="latte" class="img-cover" />
              </td>

            <tr>
              <td class="text-center">4</td>
              <td class="text-center">
                <img src="espresso.webp" alt="espresso" class="img-cover" />

              <td>Rp 17.000</td>
              <td class="text-center">
                <button class="btn-primary">Beli</button>
              </td>
            </tr>
            <tr>
              <td class="text-center">5</td>
              <td class="text-center">
                <img src="matcha.webp" alt="matcha" class="img-cover" />
              </td>
              <td><strong>Ice Matcha</strong></td>

              <td class="text-center">
                <button class="btn-primary">Beli</button>
              </td>
