<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator</title>
    <link rel="stylesheet" href="desain.css" />
  </head>
  <body>
    <div class="container">
      <h2 class="judul">Kalkulator Invoice</h2>

      <div class="form-group">
        <label>Nama Barang:</label>
        <input type="text" placeholder="Masukan nama barang anda" />
      </div>

      <div class="form-group">
        <label>Harga:</label>
        <input type="number" id="angka1" placeholder="0" />
      </div>
      <div class="form-group">
        <label>Jumlah barang:</label>
        <input type="number" id="angka2" placeholder="0" />
      </div>
      <div class="card">
        <h4 class="sub">Total : Rp <span id="hasil" class="hasil"></span></h4>
      </div>
    </div>
    <script src="coba.js"></script>
  </body>
</html>
